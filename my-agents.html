      buyHint.innerHTML = '💡 <strong>直接访问体验版</strong> · 完整 5 系统 + 永久个人 URL：<a href="https://lwy9079.gumroad.com/l/hzylw" target="_blank" style="color: #d6249f; font-weight: 700;">$5-$25 购买</a>';
      const container = document.getElementById('chatPanels');
      if (container && container.firstChild) container.firstChild.querySelector('.messages').prepend(buyHint);
    }, 800);
  }
}

function saveConfig() {
  if (config) {
    localStorage.setItem('my_agents_config', JSON.stringify(config));
    if (isPaid) localStorage.setItem('my_agents_paid', 'true');
  }
}

function resetSetup() {
  if (confirm('确定要重新设置吗？这会清除你的设置和聊天历史。')) {
    localStorage.removeItem('my_agents_config');
    localStorage.removeItem('my_agents_paid');
    Object.keys(chatStates).forEach(k => localStorage.removeItem('agent_chat_' + k));
    config = null;
    isPaid = false;
    showMiniSetup();
  }
}

// ============ UI ============
function buildUI() {
  const tabsContainer = document.getElementById('tabsContainer');
  tabsContainer.innerHTML = '';
  const systems = config.systems && config.systems.length > 0 ? config.systems : Object.keys(SYSTEMS);
  systems.forEach(sysKey => {
    const sys = SYSTEMS[sysKey];
    if (!sys) return;
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.system = sysKey;
    btn.innerHTML = `<span class="emoji">${sys.emoji}</span>${sys.name}`;
    btn.onclick = () => switchSystem(sysKey);
    tabsContainer.appendChild(btn);
  });

  const chatPanels = document.getElementById('chatPanels');
  chatPanels.innerHTML = '';
  systems.forEach(sysKey => {
    const sys = SYSTEMS[sysKey];
    if (!sys) return;
    const panel = document.createElement('div');
    panel.className = 'chat-panel';
    panel.dataset.system = sysKey;
    panel.innerHTML = `
      <div class="chat-header">
        <div class="chat-title">${sys.emoji} ${sys.name}</div>
        <div class="chat-actions">
          <button class="chat-action" onclick="clearChat('${sysKey}')">🗑️ 清空</button>
        </div>
      </div>
      <div class="messages" id="messages-${sysKey}"></div>
      <div class="input-area">
        <div class="quick-replies" id="quickReplies-${sysKey}"></div>
        <div class="input-row">
          <input type="text" id="input-${sysKey}" placeholder="输入消息... (Enter 发送)" autocomplete="off">
          <button id="sendBtn-${sysKey}" onclick="sendMessage('${sysKey}')">发送</button>
        </div>
      </div>
    `;
    chatPanels.appendChild(panel);
  });

  systems.forEach(sysKey => {
    document.getElementById(`input-${sysKey}`).addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(sysKey);
      }
    });
  });

  systems.forEach(sysKey => loadChat(sysKey));
}

function switchSystem(sysKey) {
  currentSystem = sysKey;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tab = document.querySelector(`.tab[data-system="${sysKey}"]`);
  if (tab) tab.classList.add('active');
  document.querySelectorAll('.chat-panel').forEach(p => p.classList.remove('active'));
  const panel = document.querySelector(`.chat-panel[data-system="${sysKey}"]`);
  if (panel) panel.classList.add('active');
  setTimeout(() => {
    const input = document.getElementById(`input-${sysKey}`);
    if (input) input.focus();
  }, 100);
}

function loadChat(sysKey) {
  const stored = localStorage.getItem('agent_chat_' + sysKey);
  chatStates[sysKey] = stored ? JSON.parse(stored) : [];
  renderMessages(sysKey);
  if (chatStates[sysKey].length === 0) {
    const sys = SYSTEMS[sysKey];
    const qr = document.getElementById(`quickReplies-${sysKey}`);
    qr.innerHTML = '';
    sys.quickReplies.forEach(reply => {
      const btn = document.createElement('div');
      btn.className = 'quick-reply';
      btn.textContent = reply;
      btn.onclick = () => {
        document.getElementById(`input-${sysKey}`).value = reply;
        sendMessage(sysKey);
      };
      qr.appendChild(btn);
    });
    addMessage(sysKey, 'ai', personalizeWelcome(sys.welcome));
  } else {
    document.getElementById(`quickReplies-${sysKey}`).innerHTML = '';
  }
}

function personalizeWelcome(text) {
  return text + (config && config.name ? `\n\n👋 欢迎你，${config.name}！` : '');
}

function renderMessages(sysKey) {
  const container = document.getElementById(`messages-${sysKey}`);
  container.innerHTML = '';
  chatStates[sysKey].forEach(m => addMessage(sysKey, m.role, m.content, false));
  container.scrollTop = container.scrollHeight;
}

function addMessage(sysKey, role, text, scroll = true) {
  const container = document.getElementById(`messages-${sysKey}`);
  const msg = document.createElement('div');
  msg.className = 'message ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role === 'user' ? '🙋' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;
  bubble.textContent = text;
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  container.appendChild(msg);
  if (scroll) container.scrollTop = container.scrollHeight;
  return bubble;
}

function addTypingIndicator(sysKey) {
  const container = document.getElementById(`messages-${sysKey}`);
  const msg = document.createElement('div');
  msg.className = 'message';
  msg.id = 'typingMsg-' + sysKey;
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ai';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator(sysKey) {
  const el = document.getElementById('typingMsg-' + sysKey);
  if (el) el.remove();
}

function clearChat(sysKey) {
  if (!confirm('清空 ' + SYSTEMS[sysKey].name + ' 的对话历史？')) return;
  chatStates[sysKey] = [];
  localStorage.removeItem('agent_chat_' + sysKey);
  loadChat(sysKey);
}

async function sendMessage(sysKey) {
  if (!isPaid) {
    alert('请先完成设置。');
    return;
  }
  const input = document.getElementById(`input-${sysKey}`);
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  document.getElementById(`sendBtn-${sysKey}`).disabled = true;

  addMessage(sysKey, 'user', text);
  document.getElementById(`quickReplies-${sysKey}`).innerHTML = '';

  addTypingIndicator(sysKey);

  try {
    const reply = await callGemini(sysKey, text);
    removeTypingIndicator(sysKey);
    addMessage(sysKey, 'ai', reply);
    chatStates[sysKey].push({ role: 'user', content: text });
    chatStates[sysKey].push({ role: 'assistant', content: reply });
    localStorage.setItem('agent_chat_' + sysKey, JSON.stringify(chatStates[sysKey]));
  } catch (e) {
    removeTypingIndicator(sysKey);
    addMessage(sysKey, 'ai', '❌ 出错了：' + e.message);
  } finally {
    input.disabled = false;
    document.getElementById(`sendBtn-${sysKey}`).disabled = false;
    input.focus();
  }
}

async function callGemini(sysKey, userMessage) {
  const sys = SYSTEMS[sysKey];
  const history = chatStates[sysKey] || [];
  const contextIntro = config ? `【用户背景】\n姓名：${config.name}\n业务：${config.business || '未指定'}\n目标客户：${config.customer || '未指定'}\n语言偏好：${config.lang}\n\n` : '';
  const fullPrompt = contextIntro + sys.systemPrompt;
  const fullMessages = [
    ...history,
    { role: 'user', content: userMessage }
  ];

  const contents = [];
  for (const m of fullMessages) {
    contents.push({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    });
  }

  const requestBody = {
    contents,
    systemInstruction: { parts: [{ text: fullPrompt }] },
    generationConfig: { temperature: 0.85, maxOutputTokens: 2048, topP: 0.95 },
    safetySettings: [
      { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE' },
      { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE' },
      { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
      { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' }
    ]
  };

  const response = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(requestBody)
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error('API ' + response.status + ': ' + errText.substring(0, 200));
  }
  const data = await response.json();
  const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!reply) throw new Error('Empty response from Gemini');
  return reply;
}

// ============ Personal URL ============
function showUrlBanner() {
  const banner = document.getElementById('urlBanner');
  const urlText = document.getElementById('urlText');
  // Build token from config (auto-deploy format)
  const token = btoa(JSON.stringify({
    paid: true,
    name: config.name,
    email: config.email || '',
    tier: config.tier || 'agency',
    systems: config.systems,
    lang: config.lang,
    createdAt: config.createdAt,
  }));
  const personalUrl = window.location.origin + window.location.pathname + '?token=' + encodeURIComponent(token);
  urlText.textContent = personalUrl;
  history.replaceState(null, '', '?token=' + encodeURIComponent(token));
  banner.style.display = 'flex';
}

function copyUrl() {
  const urlText = document.getElementById('urlText').textContent;
  navigator.clipboard.writeText(urlText).then(() => {
    const btn = document.querySelector('.copy-btn');
    const orig = btn.textContent;
    btn.textContent = '✓ 已复制';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

// ============ Mini setup event listeners ============
document.addEventListener('click', e => {
  if (e.target.classList.contains('opt') && e.target.dataset.multi === 'true') {
    e.target.classList.toggle('selected');
  }
});

init();
</script>
